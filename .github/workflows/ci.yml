name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @opendam/desktop typecheck
      - run: pnpm --filter @opendam/desktop vite:build

  # ── Rust backend ──────────────────────────────────────────────────────────
  rust:
    name: Rust (cargo check + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - name: cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri
      - name: clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri

  # ── Python preview engine ────────────────────────────────────────────────
  python:
    name: Python (ruff lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: ruff check packages/preview-engine/
